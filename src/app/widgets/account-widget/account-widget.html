<section class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
  <h2 class="text-sm font-semibold text-slate-500">My Account</h2>
  <div class="mt-3 flex items-center justify-between gap-4">
    <p class="text-3xl font-semibold tabular-nums">{{ balance() / 100 | currency: 'EUR' }}</p>
    <p-button label="Deposit" icon="pi pi-plus" (onClick)="openDeposit.emit()" />
  </div>
</section>
