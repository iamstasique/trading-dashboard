<section
  class="flex h-full min-h-0 flex-1 flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"
>
  <header
    class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-200 px-4 py-3"
  >
    @if (showHeading()) {
      <h2 class="text-sm font-semibold tracking-wide text-slate-500">News</h2>
    }
    <p-selectbutton
      class="ml-auto"
      [options]="newsSortOptions"
      [ngModel]="sort()"
      (ngModelChange)="onNewsSortChange($event)"
      optionLabel="label"
      optionValue="value"
      [allowEmpty]="false"
    />
  </header>

  <div class="min-h-0 flex-1 overflow-y-auto p-4">
    @if (loading() && articles().length === 0) {
      <p class="text-sm text-slate-500">Loading articles…</p>
    } @else {
      @if (errorMessage(); as message) {
        <div class="mb-3 flex items-center justify-between gap-3">
          <p class="text-sm text-red-600">{{ message }}</p>
          <p-button label="Retry" [text]="true" size="small" (onClick)="retry.emit()" />
        </div>
      }
      <ul class="flex flex-col gap-3">
        @for (article of articles(); track article.id) {
          <li>
            <app-news-article [article]="article" />
          </li>
        } @empty {
          @if (!errorMessage()) {
            <li>
              <p class="text-sm text-slate-500">No articles.</p>
            </li>
          }
        }
      </ul>
    }
  </div>
</section>
