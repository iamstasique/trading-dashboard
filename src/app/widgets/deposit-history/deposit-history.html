<section
  class="flex h-full min-h-0 flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"
>
  <h2
    class="border-b border-slate-200 px-4 py-3 text-sm font-semibold tracking-wide text-slate-500"
  >
    Deposit History
  </h2>
  @if (storageError(); as message) {
    <p class="border-b border-red-100 bg-red-50 px-4 py-2 text-sm text-red-700">{{ message }}</p>
  }
  <div class="min-h-0 flex-1 overflow-y-auto p-4">
    <ul class="flex flex-col gap-3">
      @for (item of deposits(); track item.id) {
        <li>
          <app-deposit-history-item [deposit]="item" />
        </li>
      } @empty {
        @if (!storageError()) {
          <li>
            <p class="text-sm text-slate-500">No deposits yet.</p>
          </li>
        }
      }
    </ul>
  </div>
</section>
