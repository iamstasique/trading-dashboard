<article class="rounded-lg border border-slate-200 p-3">
  <div class="flex items-start justify-between gap-3">
    <p class="text-sm text-slate-500">{{ deposit().date | date: 'medium' }}</p>
    <p class="font-semibold tabular-nums">{{ deposit().amount / 100 | currency: 'EUR' }}</p>
  </div>
  <p class="mt-2 text-sm font-medium">{{ deposit().method }}</p>
  @if (deposit().notes) {
    <p class="mt-1 line-clamp-3 text-sm whitespace-pre-wrap text-slate-600">
      {{ deposit().notes }}
    </p>
  }
</article>
